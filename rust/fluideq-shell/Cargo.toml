[package]
name = "fluideq-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Lightweight Rust desktop shell, IPC router, and zero-FPS silence-gated spectrum publisher for FluidEQ 2.1"

[dependencies]
fluideq-dsp-sys = { path = "../fluideq-dsp-sys" }
fluideq-state = { path = "../fluideq-state" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
link-cpp-core = ["fluideq-dsp-sys/link-cpp-core", "fluideq-state/link-cpp-core"]
