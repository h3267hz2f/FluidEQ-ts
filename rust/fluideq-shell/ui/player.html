<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>FluidEQ Player</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="player.css" />
  </head>
  <body class="player-body">
    <div class="player" data-tauri-drag-region>
      <img id="player-cover" class="player-cover" alt="" hidden />
      <div class="player-main">
        <p id="player-title" class="player-title" data-tauri-drag-region>Nothing playing</p>
        <p id="player-artist" class="player-artist" data-tauri-drag-region></p>
        <div class="player-line">
          <span id="player-time" class="player-time"></span>
          <div class="player-buttons">
            <button id="player-previous" class="media-btn" type="button" aria-label="Previous track" disabled>Prev</button>
            <button id="player-play" class="media-btn" type="button" disabled>Play</button>
            <button id="player-next" class="media-btn" type="button" aria-label="Next track" disabled>Next</button>
          </div>
        </div>
        <div class="player-volume">
          <span class="player-volume-label">Volume</span>
          <input id="player-volume" class="player-volume-range" type="range" min="0" max="1" step="0.01" value="1" aria-label="System volume" />
        </div>
      </div>
      <button id="player-close" class="player-close" type="button" aria-label="Close the compact player">×</button>
    </div>
    <script type="module" src="player.js"></script>
  </body>
</html>
