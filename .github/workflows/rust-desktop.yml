name: Rust desktop

# The repository is private and hosted runners are billed per minute, so this
# workflow is deliberate rather than continuous: a tag or an explicit run.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the Rust state centre and shell
        run: cargo test --workspace --features link-cpp-core

      - name: Build the Tauri shell and the NSIS installer
        working-directory: rust/fluideq-shell
        run: npx -y @tauri-apps/cli@2 build --features link-cpp-core

      - uses: actions/upload-artifact@v4
        with:
          name: FluidEQ-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
