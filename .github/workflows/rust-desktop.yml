name: Rust desktop

# The repository is public and hosted runners are free for public repositories,
# but this workflow is still deliberate rather than continuous: a tag or an
# explicit run.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Build the NSIS installer after the tests"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: rust-desktop-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The C++ core includes a header generated from the one parameter table
      # and gitignored, so it must exist before the first cargo build.
      - name: Generate the native parameter header
        run: node native/tools/generate-parameters.mjs

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Test the Rust state centre and shell
        run: cargo test --workspace --features link-cpp-core --locked

      - uses: ilammy/msvc-dev-cmd@v1
        if: github.event_name != 'workflow_dispatch' || inputs.bundle
        with:
          arch: x64

      - name: Stage the native engine into the installer
        if: github.event_name != 'workflow_dispatch' || inputs.bundle
        run: node rust/fluideq-shell/scripts/stage-native-engine.mjs

      - name: Build the Tauri shell and the NSIS installer
        if: github.event_name != 'workflow_dispatch' || inputs.bundle
        working-directory: rust/fluideq-shell
        run: npx -y @tauri-apps/cli@2.12.4 build --features link-cpp-core --config tauri.bundle.conf.json

      - name: Verify the installer carries the engine
        if: github.event_name != 'workflow_dispatch' || inputs.bundle
        shell: pwsh
        run: |
          $installer = Get-Item target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer was produced" }
          $listing = & 7z l $installer.FullName
          foreach ($name in @("FluidEQ-Engine.dll", "FluidEQ-Engine-Setup.exe", "FluidEQ-DSP.exe", "FluidEQ-Outputs.exe", "FluidEQ-Games.exe", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if (-not ($listing | Select-String -SimpleMatch $name)) {
              throw "installer is missing $name"
            }
          }

      # Written from the installer the build just produced, so a download can
      # be checked against the exact bytes this run uploaded.
      - name: Write the installer hash manifest
        if: github.event_name != 'workflow_dispatch' || inputs.bundle
        shell: pwsh
        run: |
          $installer = Get-Item target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer was produced" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $line = "$hash  $($installer.Name)"
          Set-Content -Path target/release/bundle/nsis/SHA256SUMS.txt -Value $line -Encoding ascii
          Write-Host $line

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.bundle
        with:
          name: FluidEQ-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
