name: Native engine

# The Rust state centre and the C++ core must agree word for word, so a Rust
# change is a native change: `rust/**` triggers this too, and the whole suite
# runs rather than only the attachment tests.
on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - "rust/**"
      - "src/common/dsp/nativeParameters.ts"
      - ".github/workflows/native-engine.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: native-engine-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Generate the native parameter header
        run: node native/tools/generate-parameters.mjs

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure the native engine
        run: >
          cmake -S native -B native/.build/engine
          -A x64
          "-DFEQ_CORE_VERSION=2.1.0"
          "-DFEQ_BUILD_REVISION=${{ github.sha }}"

      # Every target, tests included: a green suite is the only evidence that
      # the Rust mirror and the C++ core still process the same bytes.
      - name: Build the engine and every test
        run: >
          cmake --build native/.build/engine --config Release --parallel

      # `preset-safety-*` and `dsp-parity` read frozen fixture corpora that are
      # generated by the old Electron build script and are not in the
      # repository, so they cannot run here yet. Everything else can.
      - name: Test the native core
        run: >
          ctest --test-dir native/.build/engine -C Release
          --output-on-failure --no-tests=error
          -E "^(preset-safety-.*|dsp-parity)$"

      - name: Verify the engine DLL exports
        shell: pwsh
        run: |
          $dll = "native/.build/engine/bin/FluidEQ-Engine.dll"
          if (-not (Test-Path $dll)) { throw "missing $dll" }
          $exports = & dumpbin /nologo /exports $dll
          foreach ($name in @("DllGetClassObject", "DllCanUnloadNow")) {
            if (-not ($exports -match "\b$name\b")) { throw "missing export $name" }
          }

      - name: Verify the helper and host exist
        shell: pwsh
        run: |
          foreach ($file in @(
            "native/.build/engine/bin/FluidEQ-Engine-Setup.exe",
            "native/.build/engine/bin/FluidEQ-DSP.exe",
            "native/.build/engine/bin/FluidEQ-Outputs.exe",
            "native/.build/engine/bin/FluidEQ-Games.exe"
          )) {
            if (-not (Test-Path $file)) { throw "missing $file" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: FluidEQ-native-engine
          path: |
            native/.build/engine/bin/FluidEQ-Engine.dll
            native/.build/engine/bin/FluidEQ-Engine-Setup.exe
            native/.build/engine/bin/FluidEQ-DSP.exe
            native/.build/engine/bin/FluidEQ-Outputs.exe
            native/.build/engine/bin/FluidEQ-Games.exe
          if-no-files-found: error
          retention-days: 14
