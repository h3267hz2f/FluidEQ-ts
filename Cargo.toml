[workspace]
resolver = "2"
members = [
    "rust/fluideq-dsp-sys",
    "rust/fluideq-state",
    "rust/fluideq-shell",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Ivan Carmenates Garcia"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
